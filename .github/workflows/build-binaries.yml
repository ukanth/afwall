name: Build AFWall+ Binaries

on:
  workflow_dispatch:
    inputs:
      busybox_version:
        description: 'Busybox version to build'
        required: true
        default: '1.36.1'
      iptables_version:
        description: 'iptables version to build'
        required: true
        default: '1.8.10'
      release_tag:
        description: 'Release tag (optional - for uploading as release assets)'
        required: false
  push:
    paths:
      - '.github/workflows/build-binaries.yml'
      - 'build-scripts/**'
  pull_request:
    paths:
      - '.github/workflows/build-binaries.yml'

jobs:
  build-busybox:
    name: Build Busybox
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, mips, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - arch: mips
            target: mips-linux-gnu
            cc: mips-linux-gnu-gcc
            strip: mips-linux-gnu-strip
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          gcc-${{ matrix.target }} \
          file

    - name: Download Busybox source
      run: |
        BUSYBOX_VERSION="${{ github.event.inputs.busybox_version || '1.36.1' }}"
        wget -q "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"
        tar -xf "busybox-${BUSYBOX_VERSION}.tar.bz2"
        cd "busybox-${BUSYBOX_VERSION}"
        echo "BUSYBOX_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Configure Busybox for Android
      run: |
        cd "$BUSYBOX_DIR"
        
        # Start with minimal config to avoid cross-compilation issues
        make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.target }}- allnoconfig
        
        # Enable only essential features for AFWall+
        cat >> .config << 'EOF'
        CONFIG_STATIC=y
        CONFIG_INSTALL_NO_USR=y
        CONFIG_BUSYBOX=y
        CONFIG_BUSYBOX_EXEC_PATH="/system/xbin/busybox"
        CONFIG_ASH=y
        CONFIG_SH_IS_ASH=y
        CONFIG_BASH_IS_NONE=y
        CONFIG_CAT=y
        CONFIG_CHMOD=y
        CONFIG_CP=y
        CONFIG_ECHO=y
        CONFIG_GREP=y
        CONFIG_KILL=y
        CONFIG_KILLALL=y
        CONFIG_LS=y
        CONFIG_MKDIR=y
        CONFIG_MV=y
        CONFIG_PS=y
        CONFIG_RM=y
        CONFIG_TEST=y
        CONFIG_WHICH=y
        CONFIG_IPTABLES=y
        CONFIG_IP6TABLES=y
        CONFIG_FEATURE_PREFER_APPLETS=n
        CONFIG_FEATURE_SH_STANDALONE=y
        EOF
        
        # Apply minimal config (use yes to answer all prompts with default)
        yes '' | make ARCH=${{ matrix.arch }} CROSS_COMPILE=${{ matrix.target }}- oldconfig
        
        # Fix MIPS compilation issue with off_t size detection
        if [ "${{ matrix.arch }}" = "mips" ]; then
          sed -i '/BUG_off_t_size_is_misdetected/d' include/libbb.h
        fi

    - name: Build Busybox
      run: |
        cd "$BUSYBOX_DIR"
        
        # Build with explicit compiler settings
        make ARCH=${{ matrix.arch }} \
             CROSS_COMPILE=${{ matrix.target }}- \
             CC=${{ matrix.cc }} \
             HOSTCC=gcc \
             HOSTCXX=g++ \
             -j$(nproc)
        
        # Verify binary
        file busybox
        
        # Strip and copy
        ${{ matrix.strip }} busybox
        cp busybox ../busybox_${{ matrix.arch }}

    - name: Upload Busybox artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-${{ matrix.arch }}
        path: busybox_${{ matrix.arch }}

  build-iptables:
    name: Build iptables
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, mips, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
            configure_host: arm-linux-gnueabihf
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
            configure_host: aarch64-linux-gnu
          - arch: mips
            target: mips-linux-gnu
            cc: mips-linux-gnu-gcc
            strip: mips-linux-gnu-strip
            configure_host: mips-linux-gnu
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip
            configure_host: i686-linux-gnu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          gcc-${{ matrix.target }} \
          pkg-config \
          autoconf \
          automake \
          libtool \
          file

    - name: Download iptables source
      run: |
        IPTABLES_VERSION="${{ github.event.inputs.iptables_version || '1.8.10' }}"
        wget -q "https://netfilter.org/projects/iptables/files/iptables-${IPTABLES_VERSION}.tar.xz"
        tar -xf "iptables-${IPTABLES_VERSION}.tar.xz"
        cd "iptables-${IPTABLES_VERSION}"
        echo "IPTABLES_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Configure iptables
      run: |
        cd "$IPTABLES_DIR"
        
        # Set cross-compilation environment
        export CC=${{ matrix.cc }}
        export STRIP=${{ matrix.strip }}
        export CFLAGS="-static -Os -DANDROID"
        export LDFLAGS="-static"
        export PKG_CONFIG_PATH=""
        
        # Configure for cross-compilation
        ./configure \
          --host=${{ matrix.configure_host }} \
          --enable-static \
          --disable-shared \
          --disable-nftables \
          --disable-bpf-compiler \
          --disable-connlabel \
          --disable-devel \
          --with-kernel=/usr/include

    - name: Build iptables
      run: |
        cd "$IPTABLES_DIR"
        
        export CC=${{ matrix.cc }}
        export STRIP=${{ matrix.strip }}
        export CFLAGS="-static -Os -DANDROID"
        export LDFLAGS="-static"
        
        # Build
        make -j$(nproc) V=1
        
        # Copy binaries
        if [ -f "iptables/xtables-legacy-multi" ]; then
          # Prefer legacy multi-tool for compatibility
          cp "iptables/xtables-legacy-multi" "../iptables_${{ matrix.arch }}"
          cp "iptables/xtables-legacy-multi" "../ip6tables_${{ matrix.arch }}"
        else
          # Fallback to regular binaries
          cp "iptables/iptables" "../iptables_${{ matrix.arch }}"
          cp "iptables/ip6tables" "../ip6tables_${{ matrix.arch }}"
        fi
        
        # Verify and strip binaries
        file "../iptables_${{ matrix.arch }}"
        file "../ip6tables_${{ matrix.arch }}"
        
        ${{ matrix.strip }} "../iptables_${{ matrix.arch }}"
        ${{ matrix.strip }} "../ip6tables_${{ matrix.arch }}"

    - name: Upload iptables artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iptables-${{ matrix.arch }}
        path: |
          iptables_${{ matrix.arch }}
          ip6tables_${{ matrix.arch }}

  build-nflog:
    name: Build nflog
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, mips, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - arch: mips
            target: mips-linux-gnu
            cc: mips-linux-gnu-gcc
            strip: mips-linux-gnu-strip
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          gcc-${{ matrix.target }} \
          pkg-config \
          file \
          libnetfilter-log-dev

    - name: Build nflog from AFWall+ source
      run: |
        cd external/nflog
        
        # Compile nflog using AFWall+ source code
        ${{ matrix.cc }} -static \
          -I. -Ilibmnl \
          -o nflog_${{ matrix.arch }} \
          nflog.c attr.c callback.c nlmsg.c socket.c
        
        # Verify and strip
        file nflog_${{ matrix.arch }}
        ${{ matrix.strip }} nflog_${{ matrix.arch }}
        ls -la nflog_${{ matrix.arch }}

    - name: Upload nflog artifact
      uses: actions/upload-artifact@v4
      with:
        name: nflog-${{ matrix.arch }}
        path: external/nflog/nflog_${{ matrix.arch }}

  build-run-pie:
    name: Build run_pie (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - arch: mips
            target: mips-linux-gnu
            cc: mips-linux-gnu-gcc
            strip: mips-linux-gnu-strip
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-${{ matrix.target }} \
          file

    - name: Build run_pie from AFWall+ source
      run: |
        cd external/run_pie
        
        # Compile run_pie using AFWall+ source code
        ${{ matrix.cc }} -static -ldl -o run_pie_${{ matrix.arch }} run_pie.c
        
        # Verify the binary
        file run_pie_${{ matrix.arch }}
        ${{ matrix.strip }} run_pie_${{ matrix.arch }}
        ls -la run_pie_${{ matrix.arch }}

    - name: Upload run_pie artifact
      uses: actions/upload-artifact@v4
      with:
        name: run-pie-${{ matrix.arch }}
        path: external/run_pie/run_pie_${{ matrix.arch }}

  collect-binaries:
    name: Collect and Update Binaries
    runs-on: ubuntu-latest
    needs: [build-busybox, build-iptables, build-nflog, build-run-pie]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Organize binaries
      run: |
        mkdir -p app/src/main/res/raw
        
        # Create binaries directory and copy all compiled binaries
        mkdir -p binaries
        
        for arch in arm arm64 mips x86; do
          # Busybox
          if [ -f "artifacts/busybox-${arch}/busybox_${arch}" ]; then
            cp "artifacts/busybox-${arch}/busybox_${arch}" "binaries/"
            echo "✓ busybox_${arch} -> binaries/"
          fi
          
          # iptables
          if [ -f "artifacts/iptables-${arch}/iptables_${arch}" ]; then
            cp "artifacts/iptables-${arch}/iptables_${arch}" "binaries/"
            echo "✓ iptables_${arch} -> binaries/"
          fi
          
          # ip6tables
          if [ -f "artifacts/iptables-${arch}/ip6tables_${arch}" ]; then
            cp "artifacts/iptables-${arch}/ip6tables_${arch}" "binaries/"
            echo "✓ ip6tables_${arch} -> binaries/"
          fi
          
          # nflog
          if [ -f "artifacts/nflog-${arch}/nflog_${arch}" ]; then
            cp "artifacts/nflog-${arch}/nflog_${arch}" "binaries/"
            echo "✓ nflog_${arch} -> binaries/"
          fi
          
          # run_pie
          if [ -f "artifacts/run-pie-${arch}/run_pie_${arch}" ]; then
            cp "artifacts/run-pie-${arch}/run_pie_${arch}" "binaries/"
            echo "✓ run_pie_${arch} -> binaries/"
          fi
        done
        
        echo "Binary inventory:"
        ls -la binaries/

    - name: Update AFWall+ Java code for ARM64
      run: |
        # Update installBinariesArm64() to install all binaries
        if ! grep -q "installBinary.*arm64" app/src/main/java/dev/ukanth/ufirewall/Api.java; then
          # Find the function and add ARM64 support
          python3 << 'EOF'
        import re

        # Read the current Api.java file
        with open('app/src/main/java/dev/ukanth/ufirewall/Api.java', 'r') as f:
            content = f.read()

        # Define the pattern to find installBinariesArm64 function
        pattern = r'(private static boolean installBinariesArm64\(Context context\) \{[^}]*)\}'
        
        replacement = r'''\1
            // Install ARM64 binaries
            installBinary(context, "busybox_arm64", "busybox_arm64", "755", busybox_path);
            installBinary(context, "iptables_arm64", "iptables_arm64", "755", iptables_path);
            installBinary(context, "ip6tables_arm64", "ip6tables_arm64", "755", ip6tables_path);
            installBinary(context, "nflog_arm64", "nflog_arm64", "755", nflog_path);
            return true;
        }'''
        
        # Apply the replacement
        modified_content = re.sub(pattern, replacement, content, flags=re.DOTALL)
        
        # Write back the modified content
        with open('app/src/main/java/dev/ukanth/ufirewall/Api.java', 'w') as f:
            f.write(modified_content)
        
        print("✓ Updated installBinariesArm64() function")
        EOF
        else
          echo "✓ AFWall+ code already supports ARM64 binaries"
        fi

    - name: Upload compiled binaries
      uses: actions/upload-artifact@v4
      with:
        name: afwall-binaries
        path: binaries/

    - name: Create Release (optional)
      if: github.event.inputs.create_release == 'true'
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: binaries-${{ github.run_number }}
        release_name: AFWall+ Cross-compiled Binaries ${{ github.run_number }}
        body: |
          Cross-compiled binaries for AFWall+:
          - busybox (arm, arm64, mips, x86)
          - iptables (arm, arm64, mips, x86) 
          - ip6tables (arm, arm64, mips, x86)
          - nflog (arm, arm64, mips, x86)
          - run_pie (arm, arm64, mips, x86)
          
          Built from commit: ${{ github.sha }}
        draft: false
        prerelease: false
