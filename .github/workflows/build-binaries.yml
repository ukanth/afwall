name: Build AFWall+ Binaries
on:
  workflow_dispatch:
    inputs:
      busybox_version:
        description: 'Busybox version to build'
        required: true
        default: '1.36.1'
      iptables_version:
        description: 'iptables version to build'
        required: true
        default: '1.8.10'
      release_tag:
        description: 'Release tag (optional - for uploading as release assets)'
        required: false
  push:
    paths:
      - 'external/**'

jobs:
  build-busybox:
    name: Build Busybox
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          unzip \
          file

    - name: Set up Android NDK
      run: |
        NDK_VERSION="26.3.11579264"
        wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
        unzip -q android-ndk-r26d-linux.zip
        export ANDROID_NDK_ROOT="$(pwd)/android-ndk-r26d"
        echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}" >> $GITHUB_ENV
        
        # Set up NDK toolchain paths
        case "${{ matrix.arch }}" in
          arm64)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=aarch64-linux-android" >> $GITHUB_ENV
            ;;
          arm)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=armv7a-linux-androideabi" >> $GITHUB_ENV
            ;;
          x86)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=i686-linux-android" >> $GITHUB_ENV
            ;;
        esac

    - name: Download Busybox source
      run: |
        BUSYBOX_VERSION="${{ github.event.inputs.busybox_version || '1.36.1' }}"
        
        # Download with retries
        for i in {1..3}; do
          if wget -q "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"; then
            echo "✓ Downloaded busybox-${BUSYBOX_VERSION}.tar.bz2 (attempt $i)"
            break
          fi
          echo "Download attempt $i failed, retrying..."
          sleep 5
        done
        
        tar -xf "busybox-${BUSYBOX_VERSION}.tar.bz2"
        cd "busybox-${BUSYBOX_VERSION}"
        echo "BUSYBOX_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Configure Busybox for Android
      run: |
        cd "$BUSYBOX_DIR"
        
        # Start with minimal config for Android
        make ARCH=${{ matrix.arch }} allnoconfig
        
        # Enable only essential features for AFWall+
        cat >> .config << EOF
        CONFIG_STATIC=y
        CONFIG_INSTALL_NO_USR=y
        CONFIG_BUSYBOX=y
        CONFIG_BUSYBOX_EXEC_PATH="/system/xbin/busybox"
        CONFIG_ASH=y
        CONFIG_SH_IS_ASH=y
        CONFIG_BASH_IS_NONE=y
        CONFIG_CAT=y
        CONFIG_CHMOD=y
        CONFIG_CP=y
        CONFIG_ECHO=y
        CONFIG_GREP=y
        CONFIG_KILL=y
        CONFIG_KILLALL=y
        CONFIG_LS=y
        CONFIG_MKDIR=y
        CONFIG_MV=y
        CONFIG_PS=y
        CONFIG_RM=y
        CONFIG_TEST=y
        CONFIG_WHICH=y
        CONFIG_IPTABLES=y
        CONFIG_IP6TABLES=y
        CONFIG_IFCONFIG=y
        CONFIG_ROUTE=y
        CONFIG_NETSTAT=y
        CONFIG_PING=y
        CONFIG_MOUNT=y
        CONFIG_DMESG=y
        CONFIG_TAIL=y
        CONFIG_WC=y
        CONFIG_SLEEP=y
        CONFIG_HEAD=y
        CONFIG_FEATURE_PREFER_APPLETS=y
        CONFIG_FEATURE_SH_STANDALONE=y
        CONFIG_EXTRA_CFLAGS="-DHAVE_STRCHRNUL"
        EOF
        
        # Apply minimal config (use yes to answer all prompts with default)
        yes '' | make ARCH=${{ matrix.arch }} oldconfig
        
        # Fix cross-compilation issues for all architectures
        # Replace the problematic off_t size check that fails during cross-compilation
        if grep -q "struct BUG_off_t_size_is_misdetected" include/libbb.h; then
          sed -i '/struct BUG_off_t_size_is_misdetected/,/};/c\
        /* Cross-compilation fix: off_t size check disabled for all architectures */' include/libbb.h
          echo "Applied cross-compilation fix for ${{ matrix.arch }}"
        fi
        
        # Fix FAST_FUNC calling convention issue for Android/clang
        sed -i 's/__attribute__((regparm(3),stdcall))/__attribute__((regparm(3)))/g' include/platform.h
        
        # Remove busybox's strchrnul declaration since Android provides it
        sed -i '/extern char \*strchrnul.*FAST_FUNC;/d' include/platform.h
        
        # Remove strchrnul function entirely from platform.c using a more robust pattern
        sed -i '/char\* FAST_FUNC strchrnul/,/^}/d' libbb/platform.c

    - name: Build Busybox
      run: |
        cd "$BUSYBOX_DIR"
        
        # Build with Android NDK (add strchrnul fix to CFLAGS and EXTRA_CFLAGS)
        make ARCH=${{ matrix.arch }} \
             CC="${NDK_CC}" \
             HOSTCC=gcc \
             HOSTCXX=g++ \
             STRIP="${NDK_STRIP}" \
             CFLAGS="-static -DHAVE_STRCHRNUL" \
             EXTRA_CFLAGS="-DHAVE_STRCHRNUL" \
             LDFLAGS="-static" \
             -j$(nproc)
        
        # Verify binary
        file busybox
        
        # Strip and copy
        ${NDK_STRIP} busybox
        cp busybox ../busybox_${{ matrix.arch }}

    - name: Upload Busybox artifact
      uses: actions/upload-artifact@v4
      with:
        name: busybox-${{ matrix.arch }}
        path: busybox_${{ matrix.arch }}

  build-iptables:
    name: Build iptables
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
            configure_host: arm-linux-gnueabihf
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
            configure_host: aarch64-linux-gnu
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip
            configure_host: i686-linux-gnu

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          unzip \
          pkg-config \
          autoconf \
          automake \
          libtool \
          file

    - name: Set up Android NDK
      run: |
        NDK_VERSION="26.3.11579264"
        wget -q "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
        unzip -q android-ndk-r26d-linux.zip
        export ANDROID_NDK_ROOT="$(pwd)/android-ndk-r26d"
        echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}" >> $GITHUB_ENV
        
        # Set up NDK toolchain paths
        case "${{ matrix.arch }}" in
          arm64)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=aarch64-linux-android" >> $GITHUB_ENV
            ;;
          arm)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=armv7a-linux-androideabi" >> $GITHUB_ENV
            ;;
          x86)
            echo "NDK_CC=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android28-clang" >> $GITHUB_ENV
            echo "NDK_STRIP=${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
            echo "NDK_TARGET=i686-linux-android" >> $GITHUB_ENV
            ;;
        esac

    - name: Download iptables source
      run: |
        IPTABLES_VERSION="${{ github.event.inputs.iptables_version || '1.8.10' }}"
        
        # Download with retries
        for i in {1..3}; do
          if wget -q "https://netfilter.org/projects/iptables/files/iptables-${IPTABLES_VERSION}.tar.xz"; then
            echo "✓ Downloaded iptables-${IPTABLES_VERSION}.tar.xz (attempt $i)"
            break
          fi
          echo "Download attempt $i failed, retrying..."
          sleep 5
        done
        
        tar -xf "iptables-${IPTABLES_VERSION}.tar.xz"
        cd "iptables-${IPTABLES_VERSION}"
        echo "IPTABLES_DIR=$(pwd)" >> $GITHUB_ENV

    - name: Configure iptables
      run: |
        cd "$IPTABLES_DIR"
        
        # Set Android NDK cross-compilation environment
        export CC="${NDK_CC}"
        export STRIP="${NDK_STRIP}"
        
        # Set architecture-specific TLS flags and fix lock path
        case "${{ matrix.arch }}" in
          arm64)
            export CFLAGS="-static -Os -DANDROID -D_GNU_SOURCE -Wno-logical-op -Wno-unknown-warning-option -fno-emulated-tls -DXTABLES_LOCK_DIR='\"/data/local/tmp\"'"
            ;;
          *)
            export CFLAGS="-static -Os -DANDROID -D_GNU_SOURCE -Wno-logical-op -Wno-unknown-warning-option -DXTABLES_LOCK_DIR='\"/data/local/tmp\"'"
            ;;
        esac
        
        export LDFLAGS="-static"
        export PKG_CONFIG_PATH=""
        
        # Configure for Android cross-compilation
        ./configure \
          --host=${NDK_TARGET} \
          --enable-static \
          --disable-shared \
          --disable-nftables \
          --disable-bpf-compiler \
          --disable-connlabel \
          --disable-devel \
          --with-kernel=/usr/include \
          --disable-libipq \
          --with-xtlockdir=/data/local/tmp

    - name: Build iptables
      run: |
        cd "$IPTABLES_DIR"
        
        export CC="${NDK_CC}"
        export STRIP="${NDK_STRIP}"
        
        # Set architecture-specific TLS flags and fix lock path
        case "${{ matrix.arch }}" in
          arm64)
            export CFLAGS="-static -Os -DANDROID -D_GNU_SOURCE -Wno-logical-op -Wno-unknown-warning-option -fno-emulated-tls -DXTABLES_LOCK_DIR='\"/data/local/tmp\"'"
            ;;
          *)
            export CFLAGS="-static -Os -DANDROID -D_GNU_SOURCE -Wno-logical-op -Wno-unknown-warning-option -DXTABLES_LOCK_DIR='\"/data/local/tmp\"'"
            ;;
        esac
        
        export LDFLAGS="-static"
        
        # Remove only the cgroup extension (has O_PATH macro conflict)
        rm -f extensions/libxt_cgroup.c
        
        # Fix prioritynames issue in LOG extension for Android compatibility
        sed -i 's/prioritynames\[i\]\.c_name/0/g; s/prioritynames\[i\]\.c_val/0/g' extensions/libxt_LOG.c
        
        # Fix hardcoded lock path for Android - replace /run/xtables.lock with /data/local/tmp/xtables.lock
        find . -name "*.c" -o -name "*.h" | xargs grep -l "/run/xtables.lock" | while read file; do
          sed -i 's|/run/xtables\.lock|/data/local/tmp/xtables.lock|g' "$file"
          echo "Fixed lock path in $file"
        done
        
        # Build
        make -j$(nproc) V=1
        
        # Copy binaries
        if [ -f "iptables/xtables-legacy-multi" ]; then
          # Prefer legacy multi-tool for compatibility
          cp "iptables/xtables-legacy-multi" "../iptables_${{ matrix.arch }}"
          cp "iptables/xtables-legacy-multi" "../ip6tables_${{ matrix.arch }}"
        else
          # Fallback to regular binaries
          cp "iptables/iptables" "../iptables_${{ matrix.arch }}"
          cp "iptables/ip6tables" "../ip6tables_${{ matrix.arch }}"
        fi
        
        # Verify and strip binaries
        file "../iptables_${{ matrix.arch }}"
        file "../ip6tables_${{ matrix.arch }}"
        
        ${NDK_STRIP} "../iptables_${{ matrix.arch }}"
        ${NDK_STRIP} "../ip6tables_${{ matrix.arch }}"

    - name: Upload iptables artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iptables-${{ matrix.arch }}
        path: |
          iptables_${{ matrix.arch }}
          ip6tables_${{ matrix.arch }}

  build-nflog:
    name: Build nflog
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, x86]
        include:
          - arch: arm
            target: arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
          - arch: arm64
            target: aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
          - arch: x86
            target: i686-linux-gnu
            cc: i686-linux-gnu-gcc
            strip: i686-linux-gnu-strip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          wget \
          unzip \
          pkg-config \
          file \
          gcc-arm-linux-gnueabihf \
          gcc-aarch64-linux-gnu \
          gcc-i686-linux-gnu

    - name: Build nflog from AFWall+ source
      run: |
        cd external/nflog
        
        # Use GCC cross-compilers (revert from NDK to fix TLS issues) - no header fixes needed
        ${{ matrix.cc }} -static \
          -I. -Ilibmnl \
          -D_GNU_SOURCE \
          -o nflog_${{ matrix.arch }} \
          nflog.c attr.c callback.c nlmsg.c socket.c
        
        # Verify the binary
        file nflog_${{ matrix.arch }}
        ${{ matrix.strip }} nflog_${{ matrix.arch }}
        ls -la nflog_${{ matrix.arch }}

    - name: Upload nflog artifact
      uses: actions/upload-artifact@v4
      with:
        name: nflog-${{ matrix.arch }}
        path: external/nflog/nflog_${{ matrix.arch }}


  collect-binaries:
    name: Collect and Update Binaries
    runs-on: ubuntu-latest
    needs: [build-busybox, build-iptables, build-nflog]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Organize binaries
      run: |
        # Create binaries directory for testing (separate from res/raw)
        mkdir -p binaries
        
        for arch in arm arm64 x86; do
          # Busybox
          if [ -f "artifacts/busybox-${arch}/busybox_${arch}" ]; then
            cp "artifacts/busybox-${arch}/busybox_${arch}" "binaries/"
            echo "✓ busybox_${arch} -> binaries/"
          fi
          
          # iptables
          if [ -f "artifacts/iptables-${arch}/iptables_${arch}" ]; then
            cp "artifacts/iptables-${arch}/iptables_${arch}" "binaries/"
            echo "✓ iptables_${arch} -> binaries/"
          fi
          
          # ip6tables
          if [ -f "artifacts/iptables-${arch}/ip6tables_${arch}" ]; then
            cp "artifacts/iptables-${arch}/ip6tables_${arch}" "binaries/"
            echo "✓ ip6tables_${arch} -> binaries/"
          fi
          
          # nflog
          if [ -f "artifacts/nflog-${arch}/nflog_${arch}" ]; then
            cp "artifacts/nflog-${arch}/nflog_${arch}" "binaries/"
            echo "✓ nflog_${arch} -> binaries/"
          fi
          
        done
        
        echo "Binary inventory:"
        ls -la binaries/

    - name: Commit binaries to repository
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Actions"
        
        # Check if binaries directory has content
        if [ "$(ls -A binaries/)" ]; then
          echo "Committing newly built binaries..."
          
          # Stage the binaries directory
          git add binaries/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new binaries to commit"
          else
            # Create commit message
            git commit -m "Update cross-compiled binaries - busybox v${{ github.event.inputs.busybox_version || '1.36.1' }}, iptables v${{ github.event.inputs.iptables_version || '1.8.10' }} for arm/arm64/x86. Ready for testing in /binaries directory."
            
            # Push changes back to repository
            git push
            
            echo "✅ Binaries committed and pushed to /binaries directory"
            echo "📁 Ready for testing - manually copy to res/raw/ after validation"
          fi
        else
          echo "❌ No binaries were built - check build logs above"
          exit 1
        fi

    - name: Upload compiled binaries
      uses: actions/upload-artifact@v4
      with:
        name: afwall-binaries
        path: binaries/

    - name: Create Release (optional)
      if: github.event.inputs.release_tag != ''
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: AFWall+ Cross-compiled Binaries ${{ github.event.inputs.release_tag }}
        body: |
          Cross-compiled binaries for AFWall+:
          - busybox (arm, arm64, x86)
          - iptables (arm, arm64, x86) 
          - ip6tables (arm, arm64, x86)
          - nflog (arm, arm64, x86)
          
          Built from commit: ${{ github.sha }}
        files: binaries/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
